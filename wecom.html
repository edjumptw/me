<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加我企業微信 — 陳建蒲</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
  background: #E8E4DE;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.card {
  background: #fff;
  border-radius: 20px;
  width: 100%;
  max-width: 360px;
  overflow: hidden;
  box-shadow: 0 4px 32px rgba(0,0,0,0.10);
}
.card-header {
  background: #1677FF;
  padding: 28px 24px 22px;
  text-align: center;
}
.header-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 6px;
}
.wecom-icon {
  width: 28px;
  height: 28px;
}
.header-title {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.05em;
}
.header-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.04em;
}
.card-body {
  padding: 28px 24px 32px;
  text-align: center;
}
.qr-wrap {
  display: inline-block;
  background: #f5f5f5;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 20px;
}
.qr-wrap img {
  display: block;
  width: 220px;
  height: 220px;
  object-fit: cover;
  border-radius: 6px;
}
.person-name {
  font-size: 18px;
  font-weight: 700;
  color: #141414;
  margin-bottom: 4px;
}
.person-org {
  font-size: 14px;
  color: #767676;
  margin-bottom: 20px;
}
.divider {
  border: none;
  border-top: 1px solid #F0EDE8;
  margin: 0 0 20px;
}
.hint-box {
  background: #EFF6FF;
  border-radius: 10px;
  padding: 14px 18px;
  text-align: left;
}
.hint-title {
  font-size: 13px;
  font-weight: 700;
  color: #1677FF;
  margin-bottom: 6px;
}
.hint-step {
  font-size: 13px;
  color: #444;
  line-height: 1.9;
}
.hint-step span {
  display: inline-block;
  width: 18px;
  height: 18px;
  background: #1677FF;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 50%;
  text-align: center;
  line-height: 18px;
  margin-right: 6px;
  vertical-align: middle;
}
.back-btn {
  display: block;
  margin: 20px 24px 0;
  padding: 14px;
  text-align: center;
  font-size: 15px;
  font-weight: 500;
  color: #767676;
  text-decoration: none;
  border-top: 1px solid #F0EDE8;
}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="header-logo">
      <svg class="wecom-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="14" fill="white" fill-opacity="0.2"/>
        <path d="M8 11c0-2.21 2.686-4 6-4s6 1.79 6 4c0 .5-.12.98-.34 1.42C21.07 13.05 23 14.42 23 16c0 1.66-2.24 3-5 3-.55 0-1.08-.07-1.57-.19L14 20l-1.5-1.5C8.91 18.4 7 17.28 7 16c0-1.03.9-1.95 2.3-2.58A3.96 3.96 0 018 11z" fill="white"/>
      </svg>
      <div class="header-title">加我的企業微信</div>
    </div>
    <div class="header-sub">陳建蒲 · 建橋云智科技</div>
  </div>

  <div class="card-body">
    <div class="qr-wrap">
      <img src="IMG_3965.JPG" alt="企業微信 QR Code">
    </div>
    <div class="person-name">陳建蒲</div>
    <div class="person-org">建橋云智科技有限公司</div>
    <hr class="divider">
    <div class="hint-box">
      <div class="hint-title">如何添加？</div>
      <div class="hint-step">
        <span>1</span>長按上方 QR Code 圖片截圖<br>
        <span>2</span>打開微信，點擊「掃一掃」<br>
        <span>3</span>選擇「從相冊選取」，選剛截圖<br>
        <span>4</span>掃描成功後即可添加
      </div>
    </div>
  </div>

  <a class="back-btn" href="javascript:history.back()">← 返回上一頁</a>
</div>
</body>
</html>
