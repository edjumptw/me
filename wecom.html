<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>加我企業微信 — 陳建蒲</title>
<style>
/* 與首頁同一套標記，見 DESIGN.md。企業微信藍只留在這個平台的標題。 */
:root{
  color-scheme:light dark;
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1D1D1F;
  --ink-2:rgba(60,60,67,.78); --sep:rgba(60,60,67,.16);
  --fill:rgba(120,120,128,.12); --wecom:#1677FF; --on-wecom:#FFFFFF;
  --shadow:0 .03125rem .125rem rgba(0,0,0,.04), 0 .5rem 1.75rem rgba(0,0,0,.08);
  --radius:1.375rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7;
    --ink-2:rgba(235,235,245,.72); --sep:rgba(84,84,88,.65);
    --fill:rgba(120,120,128,.24);
    --shadow:0 .03125rem .125rem rgba(0,0,0,.4), 0 .5rem 1.75rem rgba(0,0,0,.45);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:1.0625rem; line-height:1.65; letter-spacing:0; font-optical-sizing:auto;
  background: var(--bg); color:var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.25rem;
  -webkit-font-smoothing:antialiased;
}
.card {
  background: var(--surface);
  border-radius: var(--radius);
  width: 100%;
  max-width: 22.5rem;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.card-header {
  background: var(--wecom);
  padding: 1.75rem 1.5rem 1.375rem;
  text-align: center;
}
.header-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  margin-bottom: .375rem;
}
.wecom-icon { width: 1.75rem; height: 1.75rem; }
.header-title {
  font-size: 1.125rem; font-weight: 700; line-height:1.3; letter-spacing:-.011em; color: var(--on-wecom);
}
.header-sub {
  font-size: .8125rem; font-weight:500; line-height:1.5; letter-spacing:.02em; color: rgba(255,255,255,.78);
}
.card-body { padding: 1.75rem 1.5rem 1.5rem; text-align: center; }
.qr-wrap {
  display: inline-block;
  background: var(--fill);
  border-radius: calc(var(--radius) - .625rem);
  padding: .625rem;
  margin-bottom: 1.25rem;
}
.qr-wrap img {
  display: block; width: 13.75rem; height: 13.75rem; object-fit: cover;
  border-radius: calc(var(--radius) - 1.25rem);
}
.person-name {
  font-size: 1.25rem; font-weight: 700; line-height:1.3; letter-spacing:-.016em; margin-bottom: .25rem;
}
.person-org {
  font-size: .875rem; line-height:1.5; color: var(--ink-2); margin-bottom: 1.25rem;
}
.divider { border: none; border-top: .0625rem solid var(--sep); margin: 0 0 1.25rem; }
.hint-box {
  background: rgba(22,119,255,.08);
  border-radius: 1rem;
  padding: .875rem 1rem;
  text-align: left;
}
.hint-title {
  font-size: .8125rem; font-weight: 600; line-height:1.5; letter-spacing:.02em; color: var(--wecom); margin-bottom: .375rem;
}
.hint-step { font-size: .875rem; line-height: 1.7; letter-spacing:0; color: var(--ink); }
.hint-step span {
  display: inline-block; width: 1.125rem; height: 1.125rem;
  background: var(--wecom); color: #fff;
  font-size: .6875rem; font-weight: 600; letter-spacing:0;
  border-radius: 50%; text-align: center; line-height: 1.125rem;
  margin-right: .375rem; vertical-align: middle;
}
.back-btn {
  display: flex; align-items: center; justify-content: center;
  min-height: 2.75rem; margin: 0 1.5rem 1.25rem;
  border-radius: 999px; background: var(--fill); color: var(--ink);
  font-size: .9375rem; font-weight: 600; letter-spacing:-.011em;
  text-decoration: none; touch-action: manipulation;
}
.press{transition:transform .1s ease-out}
.press:active{transform:scale(.97)}
:focus-visible{outline:.125rem solid var(--wecom);outline-offset:.1875rem;border-radius:999px}
@media (prefers-reduced-motion:reduce){
  .press{transition:opacity .12s ease}
  .press:active{transform:none;opacity:.7}
}
@media (prefers-contrast:more){
  .card,.hint-box,.back-btn{outline:.0625rem solid var(--ink-2)}
}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="header-logo">
      <svg class="wecom-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="14" fill="white" fill-opacity="0.2"/>
        <path d="M8 11c0-2.21 2.686-4 6-4s6 1.79 6 4c0 .5-.12.98-.34 1.42C21.07 13.05 23 14.42 23 16c0 1.66-2.24 3-5 3-.55 0-1.08-.07-1.57-.19L14 20l-1.5-1.5C8.91 18.4 7 17.28 7 16c0-1.03.9-1.95 2.3-2.58A3.96 3.96 0 018 11z" fill="white"/>
      </svg>
      <div class="header-title">加我的企業微信</div>
    </div>
    <div class="header-sub">陳建蒲 · 建橋云智科技</div>
  </div>

  <div class="card-body">
    <div class="qr-wrap">
      <img src="IMG_3965.JPG" alt="企業微信 QR Code">
    </div>
    <div class="person-name">陳建蒲</div>
    <div class="person-org">建橋云智科技有限公司</div>
    <hr class="divider">
    <div class="hint-box">
      <div class="hint-title">如何添加？</div>
      <div class="hint-step">
        <span>1</span>長按上方 QR Code 圖片截圖<br>
        <span>2</span>打開微信，點擊「掃一掃」<br>
        <span>3</span>選擇「從相冊選取」，選剛截圖<br>
        <span>4</span>掃描成功後即可添加
      </div>
    </div>
  </div>

  <a class="back-btn press" href="javascript:history.back()">← 返回上一頁</a>
</div>
</body>
</html>
